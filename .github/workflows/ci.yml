name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each entry on a gh-readonly-queue/* branch and fires
  # merge_group, not pull_request. Without this trigger the four required checks
  # never report there, so every queued PR stalls in AWAITING_CHECKS until the
  # ruleset's 30-minute timeout evicts it and nothing can ever merge.
  merge_group:
  schedule:
    # Check for upstream contract ABI drift against ourdao-contracts main
    # without waiting for a frontend PR (#541). Non-blocking on schedule.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail if generated backend types are stale (#343)
        run: npm run gen:backend -- --check
      - run: npm run typecheck

  test:
    # Node 20 is the required check and keeps the plain `test` name the
    # ruleset and the `status` job expect; 22 and 24 are informational.
    if: github.event_name != 'schedule'
    name: ${{ matrix.node == 20 && 'test' || format('test (node {0}, informational)', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.node != 20 }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Issue #240: coverage is measured per file with the V8 provider and a
  # ratchet threshold (see vitest.config.mts). The job output includes
  # the per-file report alongside the uploaded artifact.
  coverage:
    if: github.event_name != 'schedule'
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The locked Vitest and jsdom releases require a newer runtime.
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run coverage (enforces thresholds in vitest.config.mts)
        run: npm run coverage
      - name: Publish coverage summary to job output
        if: always()
        run: |
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json'); const t=s.total; console.log('Lines: '+t.lines.pct+'% ('+t.lines.covered+'/'+t.lines.total+') | Functions: '+t.functions.pct+'% | Branches: '+t.branches.pct+'% | Statements: '+t.statements.pct+'%')" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Per-file coverage (coverage/coverage-summary.json)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage/coverage-summary.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    # Node 20 is the required check and keeps the plain `build` name the
    # ruleset and the `status` job expect; 22 and 24 are informational.
    if: github.event_name != 'schedule'
    name: ${{ matrix.node == 20 && 'build' || format('build (node {0}, informational)', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node != 20 }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run build
      - name: Package Lighthouse production build
        if: matrix.node == 20
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          tar -czf "$RUNNER_TEMP/lighthouse-build.tar.gz" -C .next/standalone .
      - name: Upload Lighthouse production build
        if: matrix.node == 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-build
          path: ${{ runner.temp }}/lighthouse-build.tar.gz
          retention-days: 1
          overwrite: true

  # Screenshot baselines for the main routes in both themes × two viewports
  # (#270). An unreviewed visual change fails this job and, through `status`,
  # the PR — updating a baseline is a deliberate, reviewed act. Failed runs
  # upload the actual/expected/diff PNGs as the `visual-diffs` artifact.
  # Policy and baseline-update instructions: docs/visual-tests.md
  visual:
    if: github.event_name != 'schedule'
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload diffs and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  # End-to-end smoke tests (Playwright) against mocked RPC and backend (#374)
  e2e:
    if: github.event_name != 'schedule'
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  # Separate from lint/typecheck/test/build on purpose: a new advisory landing
  # in the tree affects every open PR at once, regardless of what that PR
  # changes. Keeping it out of `status`'s needs and off continue-on-error
  # means a fresh finding shows up as a visible (yellow-triangle) warning here
  # without turning unrelated PRs red or blocking their merge.
  audit:
    if: github.event_name != 'schedule'
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (moderate+, known ipfs-http-client findings allowlisted)
        continue-on-error: true
        run: npm run audit

  # Separate from lint for the same reason as `audit`: a package going unused
  # (or a new one landing without being wired up) isn't something the PR that
  # triggers it necessarily touched, so it's kept off `status`'s needs rather
  # than folded into an existing required job.
  depcheck:
    if: github.event_name != 'schedule'
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run depcheck

  # Knip detects unused *code* (exports, types, files, dependencies) — depcheck
  # above only detects unused *packages*. Diffed against the committed baseline
  # so pre-existing findings stay tracked as follow-ups (see
  # docs/unused-exports.md) while any NEW finding fails the build. Kept out of
  # `status`'s needs like depcheck/audit: an unused export landing in one file
  # isn't something every open PR should turn red for.
  knip:
    if: github.event_name != 'schedule'
    name: Unused exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run knip:check
      - name: Fail on a stale baseline
        run: npm run knip:baseline -- --check

  # Verifies that src/lib/generated/dao-bindings.ts matches the pinned
  # ourdao-contracts ref in contract/interface.json on PRs/pushes, and checks
  # for upstream contract drift against ourdao-contracts main on schedule
  # (non-blocking) (#143, #541).
  contract-abi-check:
    name: Contract ABI drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Resolve target ourdao-contracts ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            PINNED=$(node -e "const i=require('./contract/interface.json'); console.log(i._last_verified.split('@')[1].trim())")
            echo "ref=$PINNED" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "30.0.1"
        run: |
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version
      - name: Fetch or build contract wasm
        id: wasm
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          mkdir -p /tmp/ourdao-contract
          WASM_URL="https://github.com/ourdao/ourdao-contracts/releases/download/${REF}/ourdao_dao.optimized.wasm"
          if curl -fsSL "$WASM_URL" -o /tmp/ourdao-contract/ourdao_dao.optimized.wasm; then
            echo "path=/tmp/ourdao-contract/ourdao_dao.optimized.wasm" >> "$GITHUB_OUTPUT"
          else
            echo "No release asset at ${WASM_URL}; building ourdao-contracts @ ${REF} from source"
            git init -q /tmp/ourdao-contracts-src
            git -C /tmp/ourdao-contracts-src fetch --depth 1 https://github.com/ourdao/ourdao-contracts.git "$REF"
            git -C /tmp/ourdao-contracts-src checkout FETCH_HEAD
            rustup target add wasm32v1-none
            cargo build --manifest-path /tmp/ourdao-contracts-src/Cargo.toml --locked --target wasm32v1-none --release -p ourdao-dao
            echo "path=/tmp/ourdao-contracts-src/target/wasm32v1-none/release/ourdao_dao.wasm" >> "$GITHUB_OUTPUT"
          fi
      - name: Check contract bindings against wasm
        run: npm run gen:contract -- "${{ steps.wasm.outputs.path }}" "${{ steps.ref.outputs.ref }}" --check

  # Compares the client JS/CSS actually shipped (.next/static) against the
  # latest baseline captured from main, so a PR's effect on bundle size is
  # visible instead of invisible until someone notices the app got slower.
  bundle-size:
    if: github.event_name != 'schedule'
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      # ANALYZE_BUNDLE=1 turns on productionBrowserSourceMaps (next.config.ts) so
      # the composition report can attribute shipped bytes to packages (#266).
      - run: npm run build
        env:
          ANALYZE_BUNDLE: '1'
      - run: node scripts/bundle-size.mjs measure
      # #478: the optional HOT wallet module must stay out of the client bundle.
      # This is the evidence behind the `elliptic` audit allowlist entry — if the
      # SDK ever starts shipping, that entry is no longer truthful and this fails.
      - name: Assert the optional wallet SDK is not bundled
        run: node scripts/bundle-composition.mjs assert-absent @solana/web3.js @hot-wallet/sdk @near-js/crypto elliptic
      - name: Restore baseline from main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-size-baseline.json
          key: bundle-size-baseline-unused
          restore-keys: |
            bundle-size-baseline-
      - name: Restore composition baseline from main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-composition-baseline.json
          key: bundle-composition-baseline-unused
          restore-keys: |
            bundle-composition-baseline-
      - name: Compare against baseline and write summary
        run: node scripts/bundle-size.mjs report
      - name: Save baseline for main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp bundle-size-current.json bundle-size-baseline.json
          cp bundle-composition-current.json bundle-composition-baseline.json
      - name: Cache baseline for main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-size-baseline.json
          key: bundle-size-baseline-${{ github.sha }}
      - name: Cache composition baseline for main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-composition-baseline.json
          key: bundle-composition-baseline-${{ github.sha }}
      # Uploaded on every run so a reviewer can diff composition without
      # rebuilding locally -- the point of #266 is attributing a regression
      # without a local reproduction.
      - name: Upload composition report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-composition
          path: bundle-composition-current.json
          if-no-files-found: ignore

  lighthouse-ci:
    if: github.event_name != 'schedule'
    name: Lighthouse CI (group ${{ matrix.group }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download Lighthouse production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lighthouse-build
          path: ${{ runner.temp }}
      - name: Extract Lighthouse production build
        run: mkdir -p "$RUNNER_TEMP/lighthouse-build" && tar -xzf "$RUNNER_TEMP/lighthouse-build.tar.gz" -C "$RUNNER_TEMP/lighthouse-build"
      - name: Run Lighthouse CI against the production build
        run: npm run lhci -- --collect.startServerCommand="node $RUNNER_TEMP/lighthouse-build/server.js"
        env:
          HOSTNAME: 127.0.0.1
          LHCI_ROUTE_GROUP: ${{ matrix.group }}
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  lighthouse-status:
    name: Lighthouse CI
    if: always() && github.event_name != 'schedule'
    needs: lighthouse-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$LIGHTHOUSE_RESULT" = success
        env:
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse-ci.result }}

  # Records each job's outcome as an artifact so the privileged ci-status-comment.yml
  # workflow (triggered via workflow_run, never a fork's copy of it) can post a PR
  # comment. This job itself never runs with elevated permissions or fork code.
  status:
    name: Record status
    if: always() && github.event_name != 'schedule'
    needs: [lint, typecheck, test, coverage, build, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write status artifact
        run: |
          cat <<EOF > ci-status.json
          {
            "pr_number": ${{ toJSON(github.event.pull_request.number) }},
            "run_id": "${{ github.run_id }}",
            "results": {
              "lint": "${{ needs.lint.result }}",
              "typecheck": "${{ needs.typecheck.result }}",
              "test": "${{ needs.test.result }}",
              "coverage": "${{ needs.coverage.result }}",
              "build": "${{ needs.build.result }}",
              "visual": "${{ needs.visual.result }}"
            }
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-status
          path: ci-status.json
          retention-days: 1

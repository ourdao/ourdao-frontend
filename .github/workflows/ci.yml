name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each entry on a gh-readonly-queue/* branch and fires
  # merge_group, not pull_request. Without this trigger the four required checks
  # never report there, so every queued PR stalls in AWAITING_CHECKS until the
  # ruleset's 30-minute timeout evicts it and nothing can ever merge.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Records each job's outcome as an artifact so the privileged ci-status-comment.yml
  # workflow (triggered via workflow_run, never a fork's copy of it) can post a PR
  # comment. This job itself never runs with elevated permissions or fork code.
  status:
    name: Record status
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write status artifact
        run: |
          cat <<EOF > ci-status.json
          {
            "pr_number": ${{ toJSON(github.event.pull_request.number) }},
            "run_id": "${{ github.run_id }}",
            "results": {
              "lint": "${{ needs.lint.result }}",
              "typecheck": "${{ needs.typecheck.result }}",
              "test": "${{ needs.test.result }}",
              "build": "${{ needs.build.result }}"
            }
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ci-status
          path: ci-status.json
          retention-days: 1
